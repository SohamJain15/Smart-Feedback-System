services:
  backend:
    build: ./backend
    environment:
      SMART_FEEDBACK_DB: /app/runtime/smart_feedback.db
      SMART_FEEDBACK_MODELS: /app/runtime/models
    volumes:
      - feedback_runtime:/app/runtime
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    profiles: ["test"]

  e2e:
    build: ./e2e
    environment:
      APP_URL: http://frontend
      SELENIUM_URL: http://selenium:4444/wd/hub
    depends_on:
      frontend:
        condition: service_started
      selenium:
        condition: service_started
    profiles: ["test"]

volumes:
  feedback_runtime:
